apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: claims-repo-appset-new
spec:
  generators:
    - list:
        elements:
          - branch: dev
          - branch: qa
        #  - branch: uat
        #  - branch: prod#

  template:
    metadata:
      name: claims-kustomize-{{branch}}
    spec:
      project: default
      source:
        repoURL: https://github.com/selflearner2025/single-domain-repo-multibranch-kustomize.git
        targetRevision: "{{branch}}"
        path: test-company/claims-repo
      destination:
        server: https://kubernetes.default.svc
        namespace: claims-shared-new
      syncPolicy:
        automated:
          prune: true
